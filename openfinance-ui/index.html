    <!--
      DIRECTION CONTRACT — The Vault (seed 0adec589, operate)
      THESIS: the interface is the user's private safe-deposit room — machined steel
      plates, engraved labels, brass hardware, instrument numerals. It refuses the
      flat-black fintech card grid where every card shouts the same neon accent.
      OWN-WORLD: cool charcoal steel (#0c0e10/#14171b), hairline bevels, guilloché
      engraving on master plates, aged brass (#c5a254) only for hardware (primary
      actions, locks, active marks); Marcellus engraved caps for plate titles, Inter
      for body, JetBrains Mono tabular for every amount; verdigris/oxblood states.
      STORY: opening the app is opening the vault — net worth engraved on the master
      plate, every account a labeled deposit box, privacy toggle the lock.
      FIRST VIEWPORT: sidebar as the vault index; dashboard master plate with one
      instrument readout; trays of cards racked below on hairlines.
      FORM: grounded candidate 3 (safe-deposit furniture); raises — instrument-grade
      numerals (deep-dive), one mechanical master lock (cape), fixed identity plates
      (catalog), one time-axis law (labanotation).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying its
      provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
