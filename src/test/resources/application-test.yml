# Test datasource: SQLite, matching production so tests exercise the real dialect,
# Flyway migrations (classpath:db/migration) and JDBC driver behavior instead of H2's.
#
# The URL below is only a marker: UniqueTestDatabaseEnvironmentPostProcessor (registered via
# META-INF/spring/org.springframework.boot.env.EnvironmentPostProcessor.imports) rewrites it to a
# fresh randomly-named file under target/test-dbs/ for every distinct Spring test context. Sharing
# one file across the ~30 contexts Spring's test-context cache keeps alive simultaneously let
# concurrent HikariCP pools corrupt it (SQLITE_CORRUPT), so each context now gets its own file.
# target/test-dbs/ is wiped at the start of every test run by the maven-clean-plugin
# "clean-test-db" execution (see pom.xml).
#
# The PostgreSQL CI job overrides spring.datasource.*, spring.jpa.database-platform and
# spring.flyway.locations via environment variables (see backend-postgres.yml) so the
# exact same test classes run unmodified against both databases.
spring:
  application:
    name: open-finance-backend-test
  datasource:
    url: jdbc:sqlite:target/openfinance-test.db?foreign_keys=on&journal_mode=DELETE&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    username: ''
    password: ''
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
  main:
    allow-bean-definition-overriding: true
    banner-mode: 'off'
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # Match production's batch settings (application.yml) - batching changes which
        # Hibernate identity-insert delegate is used, avoiding a literal "default" keyword
        # in the INSERT that this SQLite JDBC driver version cannot parse.
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
  test:
    mockmvc:
      print: none
application:
  version: 0.2.6-beta
  encryption:
    enabled: true
  live-demo:
    enabled: false
  import:
    allowed-extensions: .qif,.ofx,.qfx,.csv
    max-file-size: 10MB
    temp-directory: ./temp/imports
    cleanup-after-hours: 24
  seed:
    enabled: false
server:
  port: 0
logging:
  level:
    root: WARN
    org:
      openfinance: ERROR
      springframework: WARN
      hibernate: WARN
      flywaydb: WARN
    com:
      zaxxer:
        hikari: WARN
    io:
      jsonwebtoken: WARN
    'org.openfinance.util.LoggingAspect': OFF
    'org.openfinance.config.PerformanceMonitoringAspect': OFF
    'org.springframework.boot.autoconfigure.security': ERROR
jwt:
  secret: TEST_SECRET_KEY_FOR_TESTING_ONLY_DO_NOT_USE_IN_PRODUCTION
  expiration: 3600000
