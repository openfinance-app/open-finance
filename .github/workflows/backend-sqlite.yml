name: Backend CI (SQLite)

on:
  workflow_call:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'quality/**'
      - '.github/workflows/backend-sqlite.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'quality/**'
      - '.github/workflows/backend-sqlite.yml'

jobs:
  build:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ensure Maven is available
        run: command -v mvn || (apt-get update -qq && apt-get install -y maven)

      - name: Build, test and verify
        run: mvn spotless:check verify -B

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

      - name: Archive JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ensure Maven is available
        run: command -v mvn || (apt-get update -qq && apt-get install -y maven)

      - name: Run SpotBugs
        run: mvn compile spotbugs:check -B

      - name: Run dependency check
        run: mvn dependency-check:check -B -DossIndexAnalyzerEnabled=false
