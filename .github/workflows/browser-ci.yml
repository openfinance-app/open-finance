name: Packaged Browser CI

on:
  workflow_call:
  # push:
  #   branches: [main, develop]
  #   paths: ['src/**', 'openfinance-ui/**', 'pom.xml', 'scripts/run-browser-tests.py', '.github/workflows/browser-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['src/**', 'openfinance-ui/**', 'pom.xml', 'scripts/run-browser-tests.py', '.github/workflows/browser-ci.yml']

jobs:
  browser:
    # Keep the runner on an OS supported by the locked Playwright version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: openfinance-ui/package-lock.json
      - run: npm ci
        working-directory: openfinance-ui
      - name: Use Ubuntu public mirrors for browser dependencies
        run: |
          # The Azure mirror can stall or fail DNS resolution before falling back.
          # Keep the runner's archive.ubuntu.com and security.ubuntu.com entries.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
        working-directory: openfinance-ui
      - name: Run browser tests against the packaged encrypted application
        run: python3 scripts/run-browser-tests.py
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-browser-results
          path: target/browser-tests/
