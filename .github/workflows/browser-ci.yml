name: Packaged Browser CI

on:
  workflow_call:
  workflow_dispatch:
  # push:
  #   branches: [main, develop]
  #   paths: ['src/**', 'openfinance-ui/**', 'pom.xml', 'scripts/run-browser-tests.py', '.github/workflows/browser-ci.yml']
  pull_request:
    branches: [main, develop]
    paths: ['src/**', 'openfinance-ui/**', 'pom.xml', 'scripts/run-browser-tests.py', '.github/workflows/browser-ci.yml']

jobs:
  browser:
    # Keep the runner on an OS supported by the locked Playwright version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: openfinance-ui/package-lock.json
      - run: npm ci
        working-directory: openfinance-ui
      # The hosted Ubuntu image includes Chrome's system libraries. Install the
      # locked Playwright browser without depending on Ubuntu's package mirrors.
      - run: npx playwright install chromium
        timeout-minutes: 5
        working-directory: openfinance-ui
      - name: Verify Chromium can launch
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          console.log(`Chromium ${browser.version()} is ready`);
          await browser.close();
          JS
        working-directory: openfinance-ui
      - name: Run browser tests against the packaged encrypted application
        run: python3 scripts/run-browser-tests.py
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-browser-results
          path: target/browser-tests/
